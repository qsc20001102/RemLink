services:
  server:
    image: remlink/server:1.0.8
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 20s

    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"

    ports:
      - "0.0.0.0:8080:8080/tcp"
      - "51820:51820/udp"

    volumes:
      - type: bind
        source: ./server.yaml
        target: /etc/remlink/server.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
